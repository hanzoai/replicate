name: Build replicate

on:
  push:
    branches: [main, dev, test]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/replicate
      # Stated, not defaulted. act_runner (git.hanzo.ai) drops BOOLEAN
      # workflow_call input defaults — they arrive false — while string
      # defaults propagate fine. So `push: true` was lost, buildx ran with
      # neither --push nor --load, and the job went green having published
      # nothing: run 27405 built c823047 and no tag ever appeared.
      push: true
    secrets: inherit
