name: Build replicate

# Builds ghcr.io/hanzoai/replicate, the image universe pins for the console's
# SQLite replication sidecar.
#
# This is the same reusable call that last produced an image — run 38775 on
# f864603 — restored to the directory the forge actually collects. It was
# removed from .github/workflows on the grounds that CI had moved to
# .hanzo/workflows, but no file was ever placed here, so nothing has built this
# repo since: the newest tags in ghcr are sha-a770f84 and sha-c823047, both
# commits older than that removal.
#
# push is passed as a STRING. git.hanzo.ai resolves every `type: boolean`
# workflow_call input to false — including one a caller passes explicitly — so
# a bare `true` here would leave buildx running with neither --push nor --load
# and the job would go green having published nothing.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/replicate
      push: 'true'
      # Stamps main.Version in the binary. On a branch build this is empty and
      # the Dockerfile's own ARG default (latest) stands; on a v* tag it is the
      # tag, which is what the release lane used to supply separately.
      build-args: |
        REPLICATE_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    secrets: inherit
