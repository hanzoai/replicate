services:
  s3:
    image: ghcr.io/hanzoai/s3:v1.0.14
    ports:
      - "9000:9000"
    environment:
      AWS_ACCESS_KEY_ID: hanzo
      AWS_SECRET_ACCESS_KEY: hanzos3secret
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
